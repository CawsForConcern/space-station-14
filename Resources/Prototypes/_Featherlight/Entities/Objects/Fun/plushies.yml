- type: entity
  parent: BasePlushie
  id: PlushiePholcus
  name: pholcus plushie
  description: A scruffy purple spider. Looks like he's happy to be here!
  components:
  - type: Sprite
    sprite: _Featherlight/Objects/Fun/Plushies/pholcus_plushie.rsi
    state: icon
  - type: EmitSoundOnUse
    sound: 
      path: /Audio/Voice/Arachnid/arachnid_chitter.ogg
  - type: EmitSoundOnLand
    sound: /Audio/Voice/Arachnid/arachnid_chitter.ogg
  - type: EmitSoundOnActivate
    sound: /Audio/Voice/Arachnid/arachnid_chitter.ogg
  - type: EmitSoundOnTrigger
    sound: /Audio/Voice/Arachnid/arachnid_chitter.ogg
  - type: EmitSoundOnCollide
    sound: /Audio/Voice/Arachnid/arachnid_chitter.ogg
  - type: Edible
    useSound: /Audio/Voice/Arachnid/arachnid_scream.ogg
  - type: MeleeWeapon
    soundHit: /Audio/Voice/Arachnid/arachnid_scream.ogg
  - type: Clothing
    quickEquip: false
    sprite: _Featherlight\Objects\Fun\Plushies\pholcus_plushie.rsi
    slots:
    - HEAD

